[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-gpt"
version = "0.1.0"
description = "A GPT in PyTorch, built up step by step"
requires-python = ">=3.12"
dependencies = ["torch==2.14.1", "numpy>=2.0"]

[dependency-groups]
dev = ["pytest", "ruff", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle: style errors
    "F",    # pyflakes: likely bugs, e.g. unused imports
    "I",    # isort: import ordering
    "UP",   # pyupgrade: modern Python syntax
    "B",    # flake8-bugbear: common bug patterns
    "SIM",  # flake8-simplify: needlessly complex code
    "RUF",  # ruff-specific checks
    "D",    # pydocstyle: docstring format
]
ignore = [
    "D107",    # __init__ args are documented in the class docstring
    "SIM300",  # treats shape letters (B, T, D) as constants and misreads comparisons
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]  # test names say what they check; docstrings optional

[tool.pytest.ini_options]
testpaths = ["tests"]
