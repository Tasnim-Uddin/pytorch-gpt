[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-gpt"
version = "0.1.0"
description = "A GPT in PyTorch, built up step by step"
requires-python = ">=3.12"
dependencies = ["torch==2.14.1", "numpy>=2.0"]

[dependency-groups]
dev = ["pytest", "ruff", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]   # style errors, likely bugs (e.g. unused imports), import ordering
